<div class="page-container">
  <div class="form-card">
    <div class="form-header">
      <h1>Create New Project</h1>
      <p>Enter the details below to create a new project.</p>
    </div>

    <form (ngSubmit)="onSubmit()" #projectForm="ngForm">
      <!-- Project Name -->
      <div class="form-group">
        <label for="projectName">Project Name *</label>
        <input
          type="text"
          id="projectName"
          name="projectName"
          [(ngModel)]="project.projectName"
          placeholder="Enter project name"
          maxlength="150"
          required
        />
      </div>

      <!-- Description -->
      <div class="form-group">
        <label for="description">Description</label>
        <textarea
          id="description"
          name="description"
          [(ngModel)]="project.description"
          placeholder="Enter project description"
          maxlength="1000"
          rows="4"
        ></textarea>
      </div>

      <!-- Dates -->
      <div class="date-row">
        <div class="form-group">
          <label for="startDate">Start Date *</label>
          <input
            type="date"
            id="startDate"
            name="startDate"
            [(ngModel)]="project.startDate"
            required
          />
        </div>

        <div class="form-group">
          <label for="endDate">End Date *</label>
          <input type="date" id="endDate" name="endDate" [(ngModel)]="project.endDate" required />
        </div>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label for="status">Project Status</label>
        <select id="status" name="status" [(ngModel)]="project.status">
          <option [ngValue]="1">Planning</option>
          <option [ngValue]="2">In Progress</option>
          <option [ngValue]="3">On Hold</option>
          <option [ngValue]="4">Completed</option>
          <option [ngValue]="5">Cancelled</option>
        </select>
      </div>

      <!-- Messages -->
      <div class="success-message" *ngIf="successMessage">
        {{ successMessage }}
      </div>

      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- Submit -->
      <button type="submit" [disabled]="isSubmitting || projectForm.invalid">
        {{ isSubmitting ? 'Creating...' : 'Create Project' }}
      </button>
    </form>
  </div>
</div>
